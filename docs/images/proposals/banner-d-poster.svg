  <text x="64" y="126" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#F0F4FA"><tspan fill="#2AABEE">telegram</tspan><tspan fill="#566074">-</tspan>slskd<tspan fill="#566074">-</tspan></text>
  <text x="64" y="196" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#1DB954">local-bot</text>
  <text x="64" y="244" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8B95A7">Text a song. Get the FLAC. Keep it local.</text>
