site_name: telegram-slskd-local-bot
site_url: https://geiserx.github.io/telegram-slskd-local-bot/
site_description: A Telegram bot next to your slskd that turns a song name into a lossless file in your library (or the best lossy copy when no lossless one exists), after you hear it and read its lossless check.
repo_url: https://github.com/GeiserX/telegram-slskd-local-bot
repo_name: GeiserX/telegram-slskd-local-bot
edit_uri: edit/main/docs/

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  # Dark first: the first palette entry is the default, and the banner is dark.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it:
#   nav.omitted_files   a Markdown file under docs/ that is in no nav entry and
#                       not in exclude_docs (a page nobody can reach, published
#                       at a public URL anyway);
#   nav.not_found       a nav entry whose file does not exist;
#   links.not_found     a relative link to a page or file that does not exist;
#   links.anchors       a link to a heading that does not exist;
#   links.absolute_links  a link written as /path/ (breaks under the
#                       /telegram-slskd-local-bot/ prefix of the site);
#   links.unrecognized_links  a relative link that leaves docs/ (../README.md).
#                       Repo files are linked by absolute GitHub URL instead.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # No page has been renamed since the site exists, so there is nothing to
  # redirect. When one is, add `mkdocs-redirects==1.2.2` to
  # docs/requirements-docs.txt and uncomment:
  # - redirects:
  #     redirect_maps:
  #       old-name.md: new-name.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path includes the repository root, so a page can include a file that
  # ships (docker-compose.yml, .env.example) word for word with
  # `--8<-- "docker-compose.yml"`. A copied example drifts from the real file;
  # an included one cannot. check_paths makes a missing include fail the build
  # instead of rendering an empty block. No page includes a file today; the
  # day one does, add that file to the push paths of docs.yml.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  # Renders :material-xxx: shortcodes as icons. The grid cards on index.md use
  # them; without this they print as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/telegram-slskd-local-bot
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/telegram-slskd-local-bot
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/telegram-slskd-local-bot/

extra_css:
  - stylesheets/theme.css

# Files under docs/ that are not pages. MkDocs publishes every Markdown file in
# docs/ whether or not it is in the nav, so anything that is not a page must be
# listed here. A page is a lowercase kebab-case .md file; anything with a
# capital letter is a repo-facing note. CHANGELOG.md is the one note here: it
# stays under docs/ because release.yml reads the release notes from it.
exclude_docs: |
  [A-Z]*.md
  design/
  research/
  notes/
  requirements-docs.txt

# The nav title must equal the page's H1.
nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Usage: usage.md
      - MCP server: mcp.md
      - Library sweep: sweep.md
  - Reference:
      - Configuration: configuration.md
      - How it works: how-it-works.md
      - Troubleshooting: troubleshooting.md
      - Related projects: related.md
  - Development:
      - Development: development.md
