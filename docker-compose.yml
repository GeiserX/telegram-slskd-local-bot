services:
  slskd-importer:
    image: drumsergio/telegram-slskd-local-bot:0.16.2
    build: .
    container_name: slskd_importer
    restart: unless-stopped

    environment:
      # Telegram Bot (required)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_CHAT_DELIVERY_USERS: ${TELEGRAM_CHAT_DELIVERY_USERS:-}
      # Empty: 50 MB, or 2000 MB when TELEGRAM_API_BASE_URL names a local Bot API server
      TELEGRAM_MAX_UPLOAD_MB: ${TELEGRAM_MAX_UPLOAD_MB:-}
      # Optional local Bot API server for files up to 2000 MB, e.g. the
      # telegram-bot-api service below: http://telegram-bot-api:8081
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      # Empty: 600 s with a local Bot API server, python-telegram-bot's defaults otherwise
      TELEGRAM_UPLOAD_TIMEOUT_SECS: ${TELEGRAM_UPLOAD_TIMEOUT_SECS:-}

      # Spotify API (required)
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}

      # slskd Connection (required)
      SLSKD_HOST: ${SLSKD_HOST}
      SLSKD_API_KEY: ${SLSKD_API_KEY}

      # Paths (container paths)
      DOWNLOAD_DIR: /downloads
      OUTPUT_DIR: /music
      DATA_DIR: /data

      # Download Behavior
      AUTO_MODE: ${AUTO_MODE:-false}
      MAX_RESULTS: ${MAX_RESULTS:-10}
      DURATION_TOLERANCE_SECS: ${DURATION_TOLERANCE_SECS:-5}
      SEARCH_TIMEOUT_SECS: ${SEARCH_TIMEOUT_SECS:-30}
      DOWNLOAD_TIMEOUT_SECS: ${DOWNLOAD_TIMEOUT_SECS:-600}
      ALBUM_TIMEOUT_SECS: ${ALBUM_TIMEOUT_SECS:-7200}
      DOWNLOAD_CLEANUP_HOURS: ${DOWNLOAD_CLEANUP_HOURS:-24}
      WISHLIST_CHECK_HOURS: ${WISHLIST_CHECK_HOURS:-24}
      WISHLIST_PAUSE_SECS: ${WISHLIST_PAUSE_SECS:-20}
      EXCLUDE_KEYWORDS: ${EXCLUDE_KEYWORDS:-live,remix,acoustic,karaoke,instrumental,cover,demo,radio edit,tribute,remaster}
      FILENAME_TEMPLATE: ${FILENAME_TEMPLATE:-{artist} - {title}}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # MCP over HTTP (optional, see docs/mcp.md): set MCP_PORT and MCP_TOKEN,
      # then uncomment the ports block below
      MCP_PORT: ${MCP_PORT:-}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_TOKEN: ${MCP_TOKEN:-}

    # ports:
    #   # MCP over HTTP, LAN only: publish it on the host's LAN address, never 0.0.0.0 on a public host
    #   - "192.168.1.10:8765:8765"

    volumes:
      # Mount slskd completed downloads directory (read-write: the bot
      # deletes rejected/cleaned-up files from here after processing)
      # Adjust the host path to match your slskd downloads location
      - ${SLSKD_DOWNLOAD_PATH:-./downloads}:/downloads

      # Mount output music directory (read-write)
      # This is where renamed audio files are placed
      - ${MUSIC_OUTPUT_PATH:-./music}:/music

      # Persistent data (SQLite database for history + imports)
      - ${DATA_PATH:-./data}:/data

    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Optional: a local Telegram Bot API server, so the bot can send files up to
  # 2000 MB instead of 50 MB. Start it with `docker compose --profile bigfiles up -d`
  # and set TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081 in .env.
  # TELEGRAM_API_ID and TELEGRAM_API_HASH come from https://my.telegram.org (API development tools).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    container_name: telegram_bot_api
    restart: unless-stopped
    profiles: ["bigfiles"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
